<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Gradient</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 1996 Macintosh — pixel-dither desktop, classic menu bar, square beveled windows with pinstripe title bars; Home opens with an apple.com-'96 style framed welcome panel; other pages get the blue-orb sidebar. System fonts only: Times New Roman for Latin, AppleGothic for Hangul. */
:root{
  --desk:#8A3B12; --desk2:#4E1F07; --face:#ECE8FF; --panel:#FFFFFF; --hi:#FFFFFF; --lo:#9C93CF; --dk:#111111;
  --ink:#000000; --ink2:#22222A; --muted:#4E4E58; --line:#C9C4E6; --line2:#8F87BF;
  --accent:#5B3FF0; --accent-soft:#DCD5FF; --red:#D7141F; --pink:#FF4FA3; --lime:#7CF59A; --s2:#F0812E;
  --ok:#119A45; --warn:#E0287D; --hatch:rgba(0,0,0,.22); --note:#F1F7A6;
  --f-body:"Times New Roman",Times,"AppleGothic","Apple SD Gothic Neo","Malgun Gothic",serif;
  --f-disp:"Times New Roman",Times,"AppleGothic","Apple SD Gothic Neo","Malgun Gothic",serif;
  --f-mono:"Times New Roman",Times,"AppleGothic","Apple SD Gothic Neo","Malgun Gothic",serif;
  --f-code:"Courier New",Courier,"AppleGothic","Apple SD Gothic Neo",monospace;
  --fs:17px; --side-w:232px; --gap:18px; --cal-h:84px; --r:5px;
  --bevel:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo);
  --sunken:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi);
  --drop:4px 4px 0 rgba(0,0,0,.55);
  --stripes:repeating-linear-gradient(180deg,#FFFFFF 0 2px,#111111 2px 4px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background-color:var(--desk);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--fs);line-height:1.55;-webkit-font-smoothing:auto;-webkit-text-stroke:.3px currentColor;text-rendering:optimizeLegibility;
  background-image:conic-gradient(var(--desk2) 25%,transparent 0 50%,var(--desk2) 0 75%,transparent 0);background-size:12px 12px}
/* hero — '96 apple.com welcome frame */
.hero{background:var(--face);border:2px solid var(--dk);border-radius:12px;box-shadow:var(--bevel),var(--drop);padding:10px;margin:2px 0 22px}
.hero-in{background:var(--note);border:1px solid var(--dk);box-shadow:var(--sunken);border-radius:4px;padding:clamp(22px,5vw,46px) 16px clamp(20px,4vw,38px);text-align:center;position:relative;overflow:hidden}
.hero-t{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:clamp(2.3rem,7.4vw,5rem);line-height:1;letter-spacing:-.01em;color:var(--red);text-wrap:balance}
.hero-s{margin-top:12px;font-style:italic;color:var(--ink2);font-size:clamp(.95rem,2vw,1.15rem)}
.hero-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:5px 10px;background:var(--face);border:1px solid var(--dk);box-shadow:var(--sunken);border-radius:3px;font-size:1rem}
.hero-bar b{letter-spacing:.06em;font-size:0.95rem}
.hero-bar .lk{color:var(--accent);text-decoration:underline}
.hero-bar .led{margin-left:auto;width:10px;height:10px;border-radius:50%;border:1px solid var(--dk);background:radial-gradient(circle at 35% 30%,#bfffbf,#1e9e3a 60%,#0b4d1a)}
.orb.sm{width:22px;height:22px}
.logo{flex:none;display:block;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px dotted var(--ink);outline-offset:2px}
::selection{background:var(--accent);color:#fff}
.ic{flex:none;display:block}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.app.home-mode{grid-template-columns:minmax(0,1fr)}
.app.home-mode .side,.app.home-mode .scrim{display:none!important}
/* sidebar — orb buttons */
.side{position:sticky;top:0;height:100vh;background:var(--face);border-right:1px solid var(--dk);box-shadow:var(--bevel);display:flex;flex-direction:column;padding-block:16px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px;margin-bottom:14px;background:var(--panel);border:1px solid var(--dk);box-shadow:var(--sunken)}
.brand b{display:flex;align-items:center;gap:6px;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;color:var(--red)}
.brand span{font-family:var(--f-mono);font-size:0.85rem;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:5px 8px;color:var(--accent);text-decoration:none;font-size:1rem;font-weight:700;font-style:italic;border:1px solid transparent}
.nav a:hover span{text-decoration:underline}
.nav a.on{background:var(--note);border-color:var(--dk);box-shadow:var(--sunken);color:var(--ink)}
.orb{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 34% 28%,#fff 0 7%,#B9AAFF 16%,#5B3FF0 52%,#24127A 100%);box-shadow:1px 1px 0 rgba(0,0,0,.5),inset 0 -2px 3px rgba(20,0,60,.35)}
.nav a.on .orb{color:#111;background:radial-gradient(circle at 34% 28%,#fff 0 7%,#C9FFD6 16%,#3BE07A 52%,#0B6B2C 100%)}
.side-foot{margin-top:auto;padding:10px;background:var(--panel);border:1px solid var(--dk);box-shadow:var(--sunken);font-size:0.9rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:0;border:1px solid var(--dk)}
.dot.warn{background:var(--warn)}
/* menu bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--face);border-bottom:2px solid var(--dk);box-shadow:inset 0 2px 0 var(--hi),inset 0 -2px 0 var(--lo),0 2px 0 rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;padding-block:3px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:34px;font-size:1rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--face)}
.mb-brand{display:flex;align-items:center;gap:5px;font-weight:800;padding:0 8px 0 2px;color:var(--ink);white-space:nowrap}
.orb.bolt .ic{color:#E8141F;fill:#FFFFFF;stroke-width:2.4}
a.brand,a.mb-brand{text-decoration:none;color:inherit;cursor:pointer}
a.brand:hover{background:var(--note)}
a.mb-brand:hover b{text-decoration:underline}
.mb-icons{display:flex;gap:2px;align-items:center;flex-wrap:wrap;border-left:1px solid var(--line2);padding-left:6px}
.mb-icons{gap:6px}
.mb-icons a{display:grid;place-items:center;width:30px;height:30px;border-radius:50%}
.mb-icons a:hover .orb{color:#111;background:radial-gradient(circle at 34% 28%,#fff 0 7%,#C9FFD6 16%,#3BE07A 52%,#0B6B2C 100%)}
.mb-sp{flex:1}
.top .iconbtn.pxb{width:32px;height:28px;background:var(--panel);border:1px solid var(--dk);border-radius:4px;box-shadow:var(--bevel);color:var(--ink)}
.top .iconbtn.pxb:hover{background:var(--note)}
.top .iconbtn.pxb:active{box-shadow:var(--sunken)}
.top .iconbtn.pxb:disabled{opacity:1;color:#A9A3CC;background:var(--face);box-shadow:var(--bevel);border-color:var(--line2)}
.px{display:block;shape-rendering:crispEdges}
.card.vcenter{display:flex;flex-direction:column}
.card-h > span{background:#FFFFFF;padding:0 6px;color:var(--ink)}
.card.vcenter > .donut-wrap{flex:1;justify-content:center}
.mb-clock{font-family:var(--f-mono);font-size:1rem;padding:0 4px 0 8px;border-left:1px solid var(--line2)}
.top .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:0.92rem;margin-left:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;color:var(--ink2);border:1px solid transparent}
.iconbtn:hover{background:var(--face);border-color:var(--dk);box-shadow:var(--bevel);color:var(--ink)}
.iconbtn:active{box-shadow:var(--sunken)}
.iconbtn:disabled{opacity:.35;cursor:default;box-shadow:none;border-color:transparent;background:none}
.menu-btn{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--dk);border-radius:var(--r);background:var(--face);box-shadow:var(--bevel);font-size:1rem;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{background:#E8E8E8}
.btn:active{box-shadow:var(--sunken);background:#CFCFCF}
.btn.pri{outline:2px solid var(--dk);outline-offset:1px;font-weight:700}
.btn.on{box-shadow:var(--sunken);background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent);text-decoration:underline}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--red)}
.btn.sm{padding:2px 8px;font-size:0.95rem}
.view{padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%}
.app.home-mode .view{max-width:1320px;margin-inline:auto}
.eyebrow{font-family:var(--f-mono);font-size:0.88rem;letter-spacing:.06em;color:var(--ink2)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding:12px 16px;background:var(--face);border:1px solid var(--dk);box-shadow:var(--bevel),var(--drop)}
.ph h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--red)}
.ph .row{display:flex;gap:8px;flex-wrap:wrap}
.hello{margin:4px 0 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hello-t{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;letter-spacing:-.03em;color:var(--red);text-shadow:1px 1px 0 #fff}
.hello-d{font-family:var(--f-mono);font-size:1rem;color:var(--ink2);background:var(--note);border:1px solid var(--dk);padding:1px 8px}
.muted{color:var(--muted)} .small{font-size:1rem}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--dk);border-radius:0;box-shadow:var(--sunken);padding:4px 7px;min-width:0}
select{box-shadow:var(--bevel);background:var(--face)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.flat{border:1px solid transparent!important;background:transparent!important;box-shadow:none!important;padding:2px 4px!important}
.flat:hover{border-color:var(--line2)!important}
.flat:focus{border-color:var(--dk)!important;background:var(--panel)!important;box-shadow:var(--sunken)!important;outline:none}
/* windows */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.card{grid-column:span var(--w,12);background:var(--face);border:1px solid var(--dk);box-shadow:var(--bevel),var(--drop);padding:16px 18px;min-width:0;position:relative}
.card.bare{background:transparent;border-color:transparent;box-shadow:none;padding:4px 0}
.card.hid{opacity:.5}
.card.dragover{outline:2px dashed var(--red);outline-offset:3px}
.card-h,.tbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-16px -18px 14px;padding:3px 8px;min-height:24px;background:var(--stripes);border-bottom:1px solid var(--dk);flex-wrap:wrap}
.card-h::before,.tbar::before{content:"";flex:none;width:12px;height:12px;border:1px solid var(--dk);background:var(--face);box-shadow:var(--bevel)}
.card-h h3,.tbar span{font-size:0.98rem;font-weight:700;letter-spacing:.02em;color:var(--ink);background:#FFFFFF;padding:0 10px;margin-right:auto}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:0.85rem;padding:1px 7px;color:var(--ink2);background:var(--face);border:1px solid var(--dk);box-shadow:var(--bevel)}
.chip:hover{background:#ECECEC}
.chip.on{box-shadow:var(--sunken);background:var(--panel);color:var(--ink);font-weight:600}
.wbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px;margin:-4px -6px 12px;background:var(--note);border:1px solid var(--dk);font-size:0.95rem}
.wbar input,.wbar select{font-size:0.95rem;padding:2px 5px}
.wbar .grow{flex:1 1 120px}
.wbar .grip{cursor:grab;color:var(--ink2)}
.wbar label{display:flex;align-items:center;gap:4px;color:var(--ink2)}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px dashed var(--dk);background:var(--note);margin-bottom:var(--gap);font-size:1rem}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cal-head .m{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.cal-head .m small{font-family:var(--f-mono);font-size:1rem;font-weight:500;color:var(--red);margin-left:10px;letter-spacing:.06em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:3px;background:var(--lo);border:1px solid var(--dk);box-shadow:var(--sunken)}
.cal .wd{font-family:var(--f-mono);font-size:0.83rem;letter-spacing:.06em;color:#fff;padding:2px 6px;background:var(--accent);font-weight:600}
.cal .wd.sun{background:var(--red)}
.cc{height:var(--cal-h);background:var(--c);color:var(--tc);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:5px 7px;text-align:left;border:1px solid var(--dk)}
.cc:hover{outline:2px solid var(--ink);outline-offset:-3px}
.cc .dn{font-family:var(--f-mono);font-size:1.15rem;font-weight:700}
.cc .pc{font-family:var(--f-mono);font-size:0.93rem;align-self:flex-end}
.cc.none{background:var(--panel);color:var(--ink2)}
.cc.none .pc{color:var(--muted)}
.cc.zero{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 7px)}
.cc.out{opacity:.4}
.cc.today{box-shadow:inset 0 0 0 3px var(--red)}
.cc.today .dn::after{content:" TODAY";font-size:0.73rem;letter-spacing:.06em;color:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:0.88rem;color:var(--ink2);font-family:var(--f-mono)}
.legend i{display:inline-block;width:20px;height:14px;margin-right:5px;vertical-align:-1px;border:1px solid var(--dk)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));grid-auto-rows:1fr;gap:10px;flex:1}
.card[data-type="kpis"]{display:flex;flex-direction:column}
.kpi{display:flex;flex-direction:column;justify-content:center}
.kpi{padding:10px 12px;background:var(--panel);border:1px solid var(--dk);box-shadow:var(--sunken)}
.kpi .v{font-family:var(--f-mono);font-size:1.9rem;font-weight:500;letter-spacing:-.02em;line-height:1.15;color:var(--accent)}
.kpi .v small{font-size:1rem;color:var(--muted);margin-left:2px}
.kpi .l{font-size:0.95rem;color:var(--ink2)}
/* bars */
.bars{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--dk);box-shadow:var(--sunken);padding:4px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(70px,1fr) 48px;align-items:center;gap:10px;padding:5px 6px;text-align:left;width:100%}
.bar-row:hover{background:var(--accent-soft);color:var(--ink)}
.bar-row:hover .pv,.bar-row:hover .muted{color:var(--ink)}
.bar-row .lb{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scode{display:inline-block;min-width:1.6em;text-align:center;padding:0 4px;border:1px solid var(--dk);color:var(--ink);margin-right:4px;font-weight:600}
.track{height:12px;background:var(--panel);border:1px solid var(--dk);box-shadow:var(--sunken);overflow:hidden;padding:1px}
.track > i{display:block;height:100%;background:repeating-linear-gradient(90deg,#2FD06A 0 7px,transparent 7px 9px)}
.bar-row .pv{font-family:var(--f-mono);font-size:0.95rem;text-align:right;color:var(--ink2)}
.svgwrap{width:100%;overflow-x:auto;background:var(--panel);border:1px solid var(--dk);box-shadow:var(--sunken)}
.svgwrap svg{width:100%;height:auto;display:block;min-width:300px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap .meta{display:flex;flex-direction:column;gap:2px;font-size:1rem;color:var(--ink2)}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sc{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--dk);background:var(--face);box-shadow:var(--bevel);text-decoration:none;color:var(--accent);font-style:italic}
.sc:hover{background:#ECECEC}
.sc b{font-weight:700;font-size:1rem}
/* planner — a sheet inside a window */
.paper{background:var(--panel);border:1px solid var(--dk);box-shadow:var(--bevel),var(--drop);padding:16px clamp(16px,4vw,44px) 36px}
.paper > .tbar{margin:-16px calc(-1 * clamp(16px,4vw,44px)) 22px}
.pdate{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px double var(--ink)}
.pdate .big{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.pdate .big small{font-family:var(--f-mono);font-size:1rem;font-weight:500;letter-spacing:.1em;margin-left:10px;color:var(--red)}
.pdate .yr{font-family:var(--f-mono);font-size:0.92rem;color:var(--muted);letter-spacing:.08em}
.pnav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;border-bottom:1px solid var(--ink)}
.pmeta > div{padding:10px 14px 10px 0;display:flex;flex-direction:column;gap:3px;min-width:0}
.pmeta > div + div{padding-left:14px;border-left:1px solid var(--line)}
.lbl{font-family:var(--f-mono);font-size:0.93rem;letter-spacing:.1em;color:var(--ink);text-transform:uppercase;font-weight:600}
.pmeta input{border:0;border-bottom:1px dotted var(--line2);box-shadow:none;padding:2px 0;background:transparent;font-family:var(--f-mono);font-size:1rem;width:100%}
.pmeta input:focus{outline:none;border-bottom:1px solid var(--accent)}
.rate{font-family:var(--f-mono);font-size:1.4rem;font-weight:600;text-align:right;color:var(--accent)}
.rate small{display:block;font-size:0.88rem;color:var(--muted);font-weight:400}
.pt-head,.prow{display:grid;grid-template-columns:22px minmax(90px,170px) minmax(0,1fr) 52px;align-items:center;column-gap:10px}
.pt-head{padding:20px 0 6px;border-bottom:1px solid var(--ink)}
.pt-head .lbl:last-child{text-align:center}
.prow{border-bottom:1px solid var(--line);padding:9px 0;min-height:46px}
.prow.drop{border-top:2px solid var(--red)}
.prow .handle{color:var(--line2);cursor:grab}
.prow:hover .handle{color:var(--ink2)}
.prow .subj{font-size:0.98rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .subj b{font-family:var(--f-mono);font-weight:600;color:var(--ink);margin-right:5px;padding:0 5px;border:1px solid var(--dk)}
.prow .task{min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
.prow .task .t{font-size:1rem;overflow-wrap:anywhere}
.prow .task:hover .t{text-decoration:underline;text-decoration-color:var(--line2)}
.prow.done .task .t{color:var(--muted);text-decoration:line-through}
.prow .task .s{font-size:0.9rem;color:var(--muted);font-family:var(--f-mono)}
.tag{font-family:var(--f-mono);font-size:0.78rem;border:1px solid var(--dk);background:var(--note);padding:0 4px;margin-left:6px;color:var(--ink2);vertical-align:2px}
.ck{justify-self:center;width:20px;height:20px;border:1px solid var(--dk);background:var(--panel);box-shadow:var(--sunken);display:grid;place-items:center;color:var(--ink)}
.ck.on{color:var(--ink)}

  return banner + head + add + body;
}

/* ============ curriculum ============ */
function vCurriculum() {
  const subs = S.curriculum.subjects, f = ui.cf;

  const o = overall();

    const st = subjStat(s), nn = s.units.reduce((a, u) => a + u.items.filter(i => (i.note || "").trim()).length, 0);
    const units = s.units.map(u => {
      const us = unitStat(u), nu = u.items.filter(i => (i.note || "").trim()).length;
      const its = u.items.filter(match);
      const filtering = f !== "all";
      const selfMatch = !u.items.length && (f === "done" ? !!u.done : f === "todo" ? !u.done : false);
      if (filtering && !its.length && !selfMatch) return "";

        <div class="crow u-row">${u.items.length ? `<button class="iconbtn" data-act="cTog" data-k="u" data-id="${u.id}" aria-label="Expand">${ic(open ? "down" : "right", 14)}</button>` : "<span></span>"}
          <div class="nm">${u.items.length ? "" : `<button class="ck ${u.done ? "on" : ""}" data-act="uDone" data-id="${u.id}" aria-label="Unit done" aria-pressed="${!!u.done}" title="Mark the whole unit done">${u.done ? ic("check", 11) : ""}</button>`}<input class="flat code" type="text" value="${esc(u.code)}" data-ch="cf" data-k="u" data-id="${u.id}" data-f="code" data-fid="uc-${u.id}" aria-label="Unit code"><input class="flat name" type="text" value="${esc(u.name)}" data-ch="cf" data-k="u" data-id="${u.id}" data-f="name" data-fid="un-${u.id}" aria-label="Unit name">${nu ? `<span class="badge" title="${nu} memos">${ic("note", 12)}${nu}</span>` : ""}</div>
          <span class="track"><i style="width:${us.pct}%"></i></span><span class="pv">${us.total ? us.pct + "%" : "—"}</span>
          <div class="acts"><button class="iconbtn" data-act="cAdd" data-k="i" data-id="${u.id}" title="Add item">${ic("plus", 14)}</button><button class="iconbtn" data-act="cMove" data-k="u" data-id="${u.id}" data-d="-1" title="Up">${ic("up", 14)}</button><button class="iconbtn" data-act="cMove" data-k="u" data-id="${u.id}" data-d="1" title="Down">${ic("down", 14)}</button><button class="iconbtn" data-act="cDup" data-k="u" data-id="${u.id}" title="Duplicate">${ic("copy", 14)}</button><button class="iconbtn" data-act="cDel" data-k="u" data-id="${u.id}" title="Delete">${ic("trash", 14)}</button></div></div>
        ${open ? `<div class="items">${its.map(it => {
          const hasNote = (it.note || "").trim(), noteOpen = ui.notes.has(it.id);
          return `<div class="irow ${it.done ? "done" : ""}" data-uid="${it.id}"><button class="ck ${it.done ? "on" : ""}" data-act="iDone" data-id="${it.id}" aria-label="Done" aria-pressed="${it.done}">${it.done ? ic("check", 11) : ""}</button>
            <input class="flat name" type="text" value="${esc(it.name)}" data-ch="cf" data-k="i" data-id="${it.id}" data-f="name" data-fid="in-${it.id}" aria-label="Item">
            <div class="acts"><button class="iconbtn ${hasNote ? "note-on" : ""}" data-act="noteTog" data-id="${it.id}" title="${hasNote ? "View memo" : "Add memo"}" aria-label="Memo">${ic("note", 14)}</button><button class="iconbtn" data-act="planIt" data-id="${it.id}" title="Add to today's plan">${ic("planner", 14)}</button><button class="iconbtn" data-act="cMove" data-k="i" data-id="${it.id}" data-d="-1" title="Up">${ic("up", 14)}</button><button class="iconbtn" data-act="cMove" data-k="i" data-id="${it.id}" data-d="1" title="Down">${ic("down", 14)}</button><button class="iconbtn" data-act="cDup" data-k="i" data-id="${it.id}" title="Duplicate">${ic("copy", 14)}</button><button class="iconbtn" data-act="cDel" data-k="i" data-id="${it.id}" title="Delete">${ic("trash", 14)}</button></div>
            ${noteOpen ? `<div class="notebox"><textarea data-in="note" data-id="${it.id}" data-fid="nt-${it.id}" placeholder="Tricky parts, confusing concepts, where to find references…" aria-label="Memo">${esc(it.note || "")}</textarea></div>` : ""}</div>`;

        <div class="acts"><button class="iconbtn" data-act="cAdd" data-k="u" data-id="${s.id}" title="Add unit">${ic("plus", 14)}</button><button class="iconbtn" data-act="cMove" data-k="s" data-id="${s.id}" data-d="-1" title="Up">${ic("up", 14)}</button><button class="iconbtn" data-act="cMove" data-k="s" data-id="${s.id}" data-d="1" title="Down">${ic("down", 14)}</button><button class="iconbtn" data-act="cDup" data-k="s" data-id="${s.id}" title="Duplicate">${ic("copy", 14)}</button><button class="iconbtn" data-act="cDel" data-k="s" data-id="${s.id}" title="Delete">${ic("trash", 14)}</button></div></div>
      ${s.collapsed && f === "all" ? "" : units}</div>`;
  }).join("");
  return `<div class="ph"><div><div class="eyebrow">Subject → Unit → Item · ${o.done}/${o.total} done</div><h1>Curriculum</h1></div>
    <div class="row"><button class="btn" data-act="cAll" data-v="open">${ic("expand", 14)}Expand all</button><button class="btn" data-act="cAll" data-v="close">${ic("collapse", 14)}Collapse all</button><button class="btn pri" data-act="cAdd" data-k="s">${ic("plus", 14)}Add subject</button></div></div>
    <div class="ctool">${chipset("cFilter", f, [["all", "All"], ["todo", "To do"], ["done", "Done"], ["note", "With memo"]])}</div>
    ${body || `<div class="empty">${f === "all" ? "No subjects. Start with Add subject." : "Nothing matches this filter."}</div>`}`;
}

/* ============ progress ============ */

  const dates = rangeDates("30"), vals = dates.map(d => { const s = dayStats(d); return s ? s.pct : null; });
  const days = dates.map(dayStats).filter(Boolean), avg = days.length ? Math.round(days.reduce((a, s) => a + s.pct, 0) / days.length) : null;
  return `<div class="ph"><div><div class="eyebrow">Counted by items · units without items count as one</div><h1>Progress</h1></div></div>
  <div class="grid">
    <section class="card vcenter" style="--w:4;--wm:2"><div class="card-h"><h3>Whole curriculum</h3></div><div class="donut-wrap">${donut(o.pct, o.pct + "%", `${o.done}/${o.total}`)}<div class="meta"><span>Done ${o.done}</span><span>To do ${o.total - o.done}</span><span>Subjects ${subs.length} · Units ${subs.reduce((a, s) => a + s.units.length, 0)}</span></div></div></section>
    <section class="card" style="--w:8;--wm:2"><div class="card-h"><h3>Last 30 days · plan completion</h3><span class="small muted num">${avg == null ? "No records" : `${avg}% average over ${days.length} planned days`}</span></div>${vals.some(v => v != null) ? seriesSVG({ dates, series: [{ name: "Completion", values: vals }], kind: "bar", yMin: 0, yMax: 100, ticks: [0, 50, 100], yFmt: v => v + "%", h: 170 }) : `<div class="empty">Shows up once you have planned days.</div>`}</section>
    <section class="card" style="--w:6;--wm:2"><div class="card-h"><h3>Progress by subject</h3></div><div class="bars">${subs.map(s => { const st = subjStat(s); return `<button class="bar-row" data-act="psub" data-id="${s.id}" style="${sel && sel.id === s.id ? "background:var(--accent-soft)" : ""}"><span class="lb"><b class="mono scode" style="background:${scol(s)}">${esc(s.code)}</b> ${esc(s.name)} <span class="small muted num">${st.done}/${st.total}</span></span><span class="track"><i style="width:${st.pct}%"></i></span><span class="pv">${st.total ? st.pct + "%" : "—"}</span></button>`; }).join("")}</div></section>
    <section class="card" style="--w:6;--wm:2"><div class="card-h"><h3>${sel ? esc(sel.code + ". " + sel.name) + " · by unit" : "Progress by unit"}</h3></div>${sel ? `<div class="bars">${sel.units.map(u => { const st = unitStat(u); return `<button class="bar-row" data-act="goUnit" data-id="${u.id}"><span class="lb">${esc(u.code)} ${esc(u.name)} <span class="small muted num">${st.done}/${st.total}</span></span><span class="track"><i style="width:${st.pct}%"></i></span><span class="pv">${st.total ? st.pct + "%" : "—"}</span></button>`; }).join("")}</div>` : `<div class="empty">Pick a subject on the left.</div>`}</section>
    <section class="card" style="--w:12;--wm:2"><div class="card-h"><h3>Wake time · Start time</h3>${chipset("pTime", ui.ptime || "month", [["week", "Week"], ["month", "Month"], ["all", "All"]])}</div>${WR.timeTrend({ cfg: { range: ui.ptime || "month", kind: "line" }, h: "m" })}</section>
  </div>`;

/* ============ AI report ============ */
function buildReport(d, opts) {
  const I = idx(), r = S.records[d] || {}, ts = planOf(d), st = dayStats(d), nd = addDays(d, 1), nts = planOf(nd);
  const tObj = (x, dd) => { const L = taskLabels(x, I); return { id: x.id, title: x.title, done: isDone(dd, x.id), subjectId: x.subjectId, unitId: x.unitId, itemId: x.itemId, subject: L.subj, unit: L.unit || null, item: L.item || null, start: hm(x.start) || null, duration: x.dur ?? null }; };
  const json = {
    type: "plos-progress-report", generatedAt: new Date().toISOString(), timezone: TZ, date: d, weekday: WK[dow(d)],
    record: { wakeTime: hm(r.wake) || null, startTime: hm(r.start) || null, place: r.place || null },
    plan: { total: st ? st.total : 0, done: st ? st.done : 0, rate: st ? st.pct : null, completed: ts.filter(x => isDone(d, x.id)).map(x => tObj(x, d)), incomplete: ts.filter(x => !isDone(d, x.id)).map(x => tObj(x, d)) },
    nextDay: { date: nd, tasks: nts.map(x => tObj(x, nd)) },
    curriculum: { overall: overall(), subjects: S.curriculum.subjects.map(s => ({ id: s.id, code: s.code, name: s.name, ...subjStat(s), units: s.units.map(u => ({ id: u.id, code: u.code, name: u.name, ...unitStat(u), items: u.items.map(it => ({ id: it.id, name: it.name, done: it.done, ...(opts.notes && (it.note || "").trim() ? { note: it.note } : {}) })) })) })) }
  };
  if (opts.comment) json.comment = r.comment || "";
  const line = x => `- [${x.done ? "x" : " "}] ${x.title}${x.start ? ` (${x.start}${x.duration ? `, ${x.duration} min` : ""})` : x.duration ? ` (${x.duration} min)` : ""} | ${x.subject}${x.unit ? " › " + x.unit : ""}${x.item ? " › " + x.item : ""} | task:${x.id}${x.itemId ? " item:" + x.itemId : x.unitId ? " unit:" + x.unitId : ""}`;
  let t = `# Study progress report — ${d} (${WK[dow(d)]})\n\n## Log\n- Wake time: ${json.record.wakeTime || "No records"}\n- Start time: ${json.record.startTime || "No records"}\n- Place: ${json.record.place || "No records"}\n\n## Today's plan (${st ? `${st.done}/${st.total} done, ${st.pct}%` : "No plan"})\n`;
  t += ts.length ? ts.map(x => line(tObj(x, d))).join("\n") : "- (none)";
  t += `\n\n### Done\n${json.plan.completed.map(x => "- " + x.title).join("\n") || "- (none)"}\n### Not done\n${json.plan.incomplete.map(x => "- " + x.title).join("\n") || "- (none)"}`;
  t += `\n\n## Next day plan — ${nd}\n${json.nextDay.tasks.map(line).join("\n") || "- (none yet)"}`;
  t += `\n\n## Curriculum progress (overall ${json.curriculum.overall.done}/${json.curriculum.overall.total}, ${json.curriculum.overall.pct}%)\n`;
  for (const s of json.curriculum.subjects) { t += `- ${s.code}. ${s.name} [subject:${s.id}] ${s.done}/${s.total} (${s.total ? s.pct + "%" : "no items"})\n`; for (const u of s.units) { t += `  - ${u.code}. ${u.name} [unit:${u.id}] ${u.done}/${u.total}\n`; for (const it of u.items) t += `    - [${it.done ? "x" : " "}] ${it.name} [item:${it.id}]${it.note ? `\n      memo: ${it.note.replace(/\n/g, " / ")}` : ""}\n`; } }
  if (opts.comment) t += `\n## COMMENT\n${r.comment || "(none)"}\n`;
  t += `\n## Reply format for the revised plan\nReply only in the JSON format below. Keep the id for existing tasks you keep or edit, and leave id out for new tasks. Existing tasks missing from the list are treated as deletion candidates.\n${IMPORT_EXAMPLE(nd)}\n`;
  return { text: t, json: JSON.stringify(json, null, 2) };
}
const IMPORT_EXAMPLE = nd => JSON.stringify({ type: "plos-plan", plans: [{ date: nd, tasks: [{ id: "(existing task id, omit for new tasks)", title: "Task", subjectId: "subject id", unitId: "unit id (optional)", itemId: "item id (optional)" }] }] }, null, 2);
function vAI() {
  const d = ui.aiDate, rep = buildReport(d, ui.ai), out = ui.ai.fmt === "json" ? rep.json : rep.text;
  const imp = ui.imp, I = idx();
  let impHtml = "";
  if (imp) {

  resetLayoutOk() { closeModal(); mutate(S => { for (const p of S.layout.pages.filter(p => !p.builtin)) toTrash("page", p.title, p, {}); S.layout = defaultLayout(); S.nav = defaultNav(); const pal = S.prefs.palette; S.prefs = { ...defaultPrefs(), palette: pal }; }); ui.edit = false; toast("Layout reset", { label: "Undo", fn: undo }); },

  trRestore(el) { mutate(() => restoreTrash(el.dataset.id)); toast("Restored"); },

};
function goUnit(unitId, itemId) {

}
function backupText() { return JSON.stringify({ app: APP, schema: SCHEMA, exportedAt: new Date().toISOString(), timezone: TZ, data: packData() }, null, 2); }
function download(name, text, type) {
  if (NATIVE) { nativePost({ type: "export", name, text }); return; }
  try { const b = new Blob([text], { type: type + ";charset=utf-8" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); toast(`Saving ${name}. If no file appears, use Copy instead.`); }
  catch (e) { toast("Couldn't start the download. Use Copy instead."); }
}
function copyText(text, fallbackEl) {
  const fb = () => { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); } toast("Auto-copy is blocked. Press Ctrl+C on the selected text."); };
  if (NATIVE && nativePost({ type: "copy", text })) { toast("Copied to clipboard"); return; }
  try { navigator.clipboard.writeText(text).then(() => toast("Copied to clipboard"), fb); } catch (e) { fb(); }
}

/* ============ change / input handlers ============ */
const CH = {
  wf(el) { const { w } = findW(el); if (!w) return; let v = el.value; if (el.dataset.f === "w" || el.dataset.f === "wm") v = +v; mutate(() => setPath(w, el.dataset.f, v)); },
  cellH(el) { mutate(() => { S.prefs.cellH = +el.value; }); },
  pageTitle(el) { const p = curPage(); mutate(() => { p.title = el.value.trim() || "Untitled"; S.nav.items.forEach(n => { if (n.page === p.id && n.label === el.defaultValue) n.label = p.title; }); }); },
  pageTitle2(el) { const p = S.layout.pages.find(x => x.id === el.dataset.id); mutate(() => { p.title = el.value.trim() || "Untitled"; }); },
  pickDate(el) { if (isDate(el.value)) goDate(el.value); },
  rf(el) {

  },
  tf(el) {
    const d = ui.pdate, t = planOf(d).find(x => x.id === el.dataset.id), f = el.dataset.f; if (!t) return;
    mutate(() => {
      const I = idx(), v = el.value;

      else if (f === "start") t.start = toMin(v);
      else if (f === "dur") t.dur = v === "" ? null : Math.max(0, Math.round(+v));
      else if (f === "end") { const e = toMin(v); if (e != null && t.start != null) t.dur = ((e - t.start) + 1440) % 1440; else if (e != null && t.dur) t.start = e - t.dur; }
      else if (f === "subjectId") { t.subjectId = v || null; t.unitId = null; t.itemId = null; }
      else if (f === "unitId") { t.unitId = v || null; t.itemId = null; }
      else if (f === "itemId") { t.itemId = v || null; if (v && I.item.get(v) && (!t.title || t.example)) t.title = I.item.get(v).it.name; }
      if (f !== "title") delete t.example;

    });
  },
  addf(el) { const f = el.dataset.f; ui.add[f] = el.value; if (f === "subjectId") { ui.add.unitId = ""; ui.add.itemId = ""; } if (f === "unitId") ui.add.itemId = ""; const tEl = $("#addtitle"); if (tEl) ui.add.title = tEl.value; scheduleRender(); },
  cf(el) { const f = findNode(el.dataset.k, el.dataset.id); if (!f) return; const v = el.value.trim(); if (!v && el.dataset.f === "name") { el.value = f.node.name; return; } mutate(() => { f.node[el.dataset.f] = v; }); },
  aiDate(el) { if (isDate(el.value)) { ui.aiDate = el.value; scheduleRender(); } },

  restFile(el) { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { ui.rest = validateBackup(String(r.result)); scheduleRender(); }; r.onerror = () => toast("Couldn't read the file"); r.readAsText(f); },
  navf(el) { const n = S.nav.items.find(x => x.id === el.dataset.id); mutate(() => { n[el.dataset.f] = el.dataset.f === "label" ? (el.value.trim() || n.label) : (el.value || null); }); },
  pref(el) { const f = el.dataset.f; mutate(() => { S.prefs[f] = f === "theme" ? el.value : +el.value; }, { history: f === "theme" }); },
  pal(el) { mutate(() => { S.prefs.palette[+el.dataset.i] = el.value; }); },

};
const IN = {
  comment(el) { const d = ui.pdate; if (!el.dataset.h) { pushHist(); el.dataset.h = "1"; } rec(d).comment = el.value; scheduleSave(); grow(el); },
  note(el) { const f = findNode("i", el.dataset.id); if (!f) return; if (!el.dataset.h) { pushHist(); el.dataset.h = "1"; } const had = !!(f.node.note || "").trim(); f.node.note = el.value; scheduleSave(); if (had !== !!el.value.trim()) { clearTimeout(IN._nt); IN._nt = setTimeout(scheduleRender, 900); } },
  wmemo(el) { const { w } = findW(el); if (!w) return; if (!el.dataset.h) { pushHist(); el.dataset.h = "1"; } w.cfg.text = el.value; scheduleSave(); grow(el); },

/* ============ modal & toast ============ */
function modal(html) { $("#modal").innerHTML = `<div class="modal-bg" data-bg="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal() { $("#modal").innerHTML = ""; }
let tT = null;
function toast(msg, action) {
  const el = $("#toast"); el.hidden = false; el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button id="toastbtn">${esc(action.label)}</button>` : ""}`;
  if (action) $("#toastbtn").onclick = () => { el.hidden = true; action.fn(); };
  clearTimeout(tT); tT = setTimeout(() => { el.hidden = true; }, action ? 6000 : 2600);
}

/* ============ events ============ */
document.addEventListener("click", e => {
  if (e.target.dataset && e.target.dataset.bg) { closeModal(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener("change", e => { const el = e.target, k = el.dataset && el.dataset.ch; if (k && CH[k]) CH[k](el, e); });
document.addEventListener("input", e => { const el = e.target, k = el.dataset && el.dataset.in; if (k && IN[k]) IN[k](el, e); if (el.dataset && el.dataset.ch === "pref" && el.type === "range") { const sp = el.nextElementSibling; if (sp) sp.textContent = el.value + "px"; } });
document.addEventListener("focusout", e => { const el = e.target; if (el.dataset && el.dataset.h) delete el.dataset.h;
  if (el.dataset && el.dataset.cell) { const { w } = findW(el); if (!w) return; const [r, c] = el.dataset.cell.split(",").map(Number); const v = el.innerText.trim(); if ((w.cfg.rows[r][c] || "") !== v) mutate(() => { w.cfg.rows[r][c] = v; }, { render: false }); }
  if (el.dataset && el.dataset.in === "note") scheduleRender();
});
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.sec) ui["sec_" + d.dataset.sec] = d.open; }, true);
document.addEventListener("keydown", e => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName) || t.isContentEditable;
  if (e.key === "Enter" && t.id === "addtitle") { e.preventDefault(); A.tAdd(); return; }
  if (e.key === "Enter" && t.dataset && t.dataset.addi) { e.preventDefault(); const v = t.value.trim(); if (!v) return; const f = findNode("u", t.dataset.addi); mutate(() => { f.node.items.push({ id: uid("i"), name: v, done: false, doneBy: null, note: "" }); }); setTimeout(() => $(`[data-addi="${f.node.id}"]`)?.focus(), 30); return; }
  if (e.key === "Enter" && t.id === "newnav") { e.preventDefault(); A.navAdd(); return; }
  if (e.key === "Enter" && t.dataset && t.dataset.ch && t.tagName === "INPUT" && t.type === "text") { t.blur(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !(typing && !e.shiftKey && t.tagName === "TEXTAREA" && t.dataset.h)) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (e.key === "Escape") { if ($("#modal").innerHTML) closeModal(); else if (ui.side) A.closeSide(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (ui.view === "planner" && (e.key === "[" || e.key === "]")) goDate(addDays(ui.pdate, e.key === "[" ? -1 : 1));
  else if (e.key === "t" || e.key === "T") goDate(today());
  else if (e.key === "h" || e.key === "H") go("home");
  else if ((e.key === "e" || e.key === "E") && (ui.view === "home" || ui.view.startsWith("page-"))) A.toggleEdit();
});
// drag & drop: widgets and planner rows

});

});
document.addEventListener("drop", e => {
  const card = e.target.closest && e.target.closest(".card[data-wid]");
  if (ui.dragW && card) { e.preventDefault(); const p = curPage(), from = p.widgets.findIndex(w => w.id === ui.dragW), to = p.widgets.findIndex(w => w.id === card.dataset.wid); if (from >= 0 && to >= 0 && from !== to) mutate(() => { const [w] = p.widgets.splice(from, 1); p.widgets.splice(to, 0, w); }); }
  const row = e.target.closest && e.target.closest(".prow[data-tid]");

  endDrag();
});

window.addEventListener("hashchange", () => { parseHash(); scheduleRender(); });

document.addEventListener("visibilitychange", () => { if (document.hidden && saveState === "pending") saveNow(); });
setInterval(() => { $$(".clock-live").forEach(el => { el.textContent = el.dataset.clk === "t" ? hm(nowMin()) : dateKo(today()); }); }, 20000);

load().then(() => { parseHash(); renderAll(); }).catch(e => { S = fresh(); store.mode = "none"; store.err = String(e); parseHash(); renderAll(); });
